<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilo-inicio.css">
    <title>Publicar-Produto</title>
</head>
<body>
    <h1>Poste o Seu Produto!</h1>
    
    
    <div class="area-d-pequena">
        <p>* Título:</p>
        <input type="text"> placeholder="Digite seu título..."
    
    </div>
    
    <div class="area-d-grande">
        <p>Legenda:</p>
        <textarea placeholder="Digite uma descriçãopara sua arte...(opcional)"></textarea>
    </div>

    <div class="upload">
        <p>Aperte e faça o upload da sua arte...</p>
        <!--falta fazer a linha que o upload funcione-->
    </div>
    
    <div class="area-d-pequena">
        <p>Categoria:</p>
        <input type="text" placeholder="Digite a categoria da arte...">
    </div>

    <div class="area-d-pequena">
        <p>Preço:</p>
        <input type="number" placeholder="Digite o preço do Produto...">
    </div>

    <div class="area-d-pequena">
        <p>Informações:</p>
        <input type="text" placeholder="Digiteinformações da arte...">
    </div>

    <div class="area-d-pequena">
        <p>Tags:</p>
        <input type="text" placeholder="Adicione Tags...">
    </div>
    
    <div class="area-botao">
        <button type="submit" class="btn-postar">Postar</button>
    </div>

    <!--FALTA FAZER O CSS DESTE IDEX-->
</body>
</html>
